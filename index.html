<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Lokhit Foundation</title>

  <meta
    name="description"
    content="Lokhit Foundation — planting and tending trees in Jaipur."
  >

  <link rel="icon" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Main website -->
  <div id="app"></div>


  <!-- Editor / sign-in bar -->
  <div id="bar">

    <span id="st">Edit mode</span>

    <select id="pgs">
      <option value="">Home</option>
      <option value="about">About</option>
      <option value="team">Team</option>
      <option value="projects">Projects</option>
      <option value="delegate-kits">Delegate kits</option>
      <option value="contact">Contact</option>
    </select>

    <button id="tg" type="button">
      Turn off
    </button>

    <button id="so" type="button">
      Sign out
    </button>

  </div>


  <!-- Sign-in dialog -->
  <dialog id="dlg">

    <form method="dialog" id="lf">

      <h3 style="font-size:28px">
        Sign in
      </h3>

      <p
        class="s"
        style="
          margin-top:8px;
          color:rgba(0,0,0,.55)
        "
      >
        Sign in to access the website editor.
      </p>

      <input
        id="em"
        type="email"
        placeholder="Email"
        autocomplete="email"
        required
      >

      <input
        id="pw"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <p
        id="er"
        class="s"
        style="color:#a33"
      ></p>

      <div
        style="
          display:flex;
          gap:8px;
          margin-top:16px
        "
      >

        <button
          class="btn"
          type="submit"
        >
          Sign in
        </button>

        <button
          class="btn"
          type="button"
          id="cx"
        >
          Cancel
        </button>

      </div>

    </form>

  </dialog>


  <!-- Application -->
  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
